name: Agent patch Android GLES AHardwareBuffer

on:
  push:
    branches:
      - agent/android-gles-ahardwarebuffer-import
    paths:
      - tools/agent_patch_android_gles_ahardwarebuffer.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-gles-ahardwarebuffer-import
          fetch-depth: 0
      - name: Patch GLES source
        run: python3 tools/agent_patch_android_gles_ahardwarebuffer.py
      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gpu/gles_backend.cpp
          git diff --cached --check
          git commit -m "Complete Android GLES AHardwareBuffer import"
          git push origin HEAD:agent/android-gles-ahardwarebuffer-import
