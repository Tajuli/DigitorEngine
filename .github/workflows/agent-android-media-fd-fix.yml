name: Agent Android Media FD Fix

on:
  push:
    branches:
      - agent/fix-android-native-assets-ninja-20260818

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Android local media source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/media/android_mediacodec_decoder.cpp')
          text = path.read_text()

          old_includes = """#include <media/NdkMediaExtractor.h>
          #include <unistd.h>
          """
          new_includes = """#include <media/NdkMediaExtractor.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <unistd.h>
          """
          old_includes = old_includes.replace('          #', '#')
          new_includes = new_includes.replace('          #', '#')
          if old_includes not in text:
              raise SystemExit('expected Android include block not found')
          text = text.replace(old_includes, new_includes, 1)

          old_source = """  i.extractor = AMediaExtractor_new();
            if (!i.extractor ||
                AMediaExtractor_setDataSource(i.extractor, i.config.media_path.c_str()) !=
                    AMEDIA_OK)
              return i.fail(DIGITOR_RESULT_NOT_INITIALIZED,
                            \"AMediaExtractor could not open media source\");
          """
          old_source = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_source.splitlines()) + '\n'
          new_source = """  i.extractor = AMediaExtractor_new();
            if (!i.extractor)
              return i.fail(DIGITOR_RESULT_NOT_INITIALIZED,
                            \"AMediaExtractor allocation failed\");

            const int source_fd =
                ::open(i.config.media_path.c_str(), O_RDONLY | O_CLOEXEC);
            if (source_fd < 0)
              return i.fail(DIGITOR_RESULT_NOT_INITIALIZED,
                            \"could not open local Android media file\");

            struct stat source_stat {};
            if (::fstat(source_fd, &source_stat) != 0 || source_stat.st_size <= 0) {
              ::close(source_fd);
              return i.fail(DIGITOR_RESULT_INVALID_ARGUMENT,
                            \"Android media file is empty or unreadable\");
            }
            const auto source_status = AMediaExtractor_setDataSourceFd(
                i.extractor, source_fd, 0, static_cast<off64_t>(source_stat.st_size));
            ::close(source_fd);
            if (source_status != AMEDIA_OK)
              return i.fail(DIGITOR_RESULT_NOT_INITIALIZED,
                            \"AMediaExtractor could not open local media file descriptor\");
          """
          new_source = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_source.splitlines()) + '\n'
          if old_source not in text:
              raise SystemExit('expected AMediaExtractor source block not found')
          text = text.replace(old_source, new_source, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/media/android_mediacodec_decoder.cpp; then
            echo "No patch changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/media/android_mediacodec_decoder.cpp
          git commit -m "Fix Android local MediaExtractor source"
          git push origin HEAD:agent/fix-android-native-assets-ninja-20260818
