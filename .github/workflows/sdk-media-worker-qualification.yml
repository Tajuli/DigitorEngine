name: SDK Media Worker Qualification

on:
  pull_request:
    paths:
      - 'include/digitor/sdk_media_worker.hpp'
      - 'src/sdk/sdk_media_worker.cpp'
      - 'include/digitor/async_operation.hpp'
      - 'src/runtime/async_operation.cpp'
      - 'tests/sdk_media_worker_tests.cpp'
      - '.github/workflows/sdk-media-worker-qualification.yml'
  workflow_dispatch:

jobs:
  qualify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build and run qualification (Unix)
        if: runner.os != 'Windows'
        run: |
          c++ -std=c++20 -pthread -Wall -Wextra -Wpedantic -Werror -Iinclude src/runtime/async_operation.cpp src/sdk/sdk_media_worker.cpp tests/sdk_media_worker_tests.cpp -o sdk_media_worker_tests
          ./sdk_media_worker_tests
      - name: Build and run qualification (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /Iinclude src\runtime\async_operation.cpp src\sdk\sdk_media_worker.cpp tests\sdk_media_worker_tests.cpp /Fe:sdk_media_worker_tests.exe
          sdk_media_worker_tests.exe

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run with TSan
        run: |
          c++ -std=c++20 -pthread -O1 -g -fno-omit-frame-pointer -fsanitize=thread -Wall -Wextra -Wpedantic -Werror -Iinclude src/runtime/async_operation.cpp src/sdk/sdk_media_worker.cpp tests/sdk_media_worker_tests.cpp -o sdk_media_worker_tsan
          TSAN_OPTIONS=halt_on_error=1 ./sdk_media_worker_tsan
