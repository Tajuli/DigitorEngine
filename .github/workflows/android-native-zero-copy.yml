name: Android Native Zero-Copy

on:
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host contract
        run: cmake -S android_native_zero_copy/contract -B build-android-native
      - name: Build
        run: cmake --build build-android-native --parallel 2
      - name: Test
        run: ctest --test-dir build-android-native --output-on-failure

  android-device-lab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, android, digitor-gpu-lab]
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 native interop
        run: |
          cmake -S android_native_zero_copy/contract -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29
          cmake --build build-android-arm64 --parallel 2
      - name: Run device qualification
        run: ./scripts/run_android_zero_copy_device_lab.sh
