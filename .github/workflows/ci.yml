name: CI
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
concurrency: {group: 'ci-${{ github.ref }}', cancel-in-progress: true}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        type: [Debug, Release]
        shared: ['OFF', 'ON']
        include:
          - {os: ubuntu-latest, type: Debug, shared: 'OFF', cc: gcc, cxx: g++}
          - {os: ubuntu-latest, type: Debug, shared: 'ON', cc: clang, cxx: clang++}
          - {os: ubuntu-latest, type: Release, shared: 'OFF', cc: gcc, cxx: g++}
          - {os: ubuntu-latest, type: Release, shared: 'ON', cc: clang, cxx: clang++}
    runs-on: ${{ matrix.os }}
    env: {CC: '${{ matrix.cc }}', CXX: '${{ matrix.cxx }}'}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DDIGITOR_ENABLE_FFMPEG=OFF -DDIGITOR_BUILD_TESTS=ON -DDIGITOR_BUILD_EXAMPLES=ON -DDIGITOR_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --config ${{ matrix.type }} --parallel 2
      - run: ctest --test-dir build -C ${{ matrix.type }} --output-on-failure -LE hardware
      - shell: bash
        run: ./scripts/test_install.sh build ${{ matrix.type }}

  ffmpeg:
    strategy: {fail-fast: false, matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
      - if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      - if: runner.os == 'Windows'
        run: vcpkg install ffmpeg:x64-windows
      - if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDIGITOR_ENABLE_FFMPEG=ON -DDIGITOR_REQUIRE_FFMPEG=ON
      - if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDIGITOR_ENABLE_FFMPEG=ON -DDIGITOR_REQUIRE_FFMPEG=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure -LE hardware

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDIGITOR_ENABLE_FFMPEG=OFF -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure -LE hardware

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
