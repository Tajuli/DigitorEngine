name: Imported Plugin Release Qualification

on:
  pull_request:
    paths:
      - 'include/digitor/imported_plugin_release_qualification.hpp'
      - 'src/plugin/imported_plugin_release_qualification.cpp'
      - 'tests/imported_plugin_release_qualification/**'
      - '.github/workflows/imported-plugin-release-qualification.yml'
  workflow_dispatch:

jobs:
  qualify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/imported_plugin_release_qualification -B build/imported-plugin-release-qualification -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/imported-plugin-release-qualification --config Release --parallel 2
      - name: Qualify on Unix
        if: runner.os != 'Windows'
        run: build/imported-plugin-release-qualification/digitor_imported_plugin_release_qualification | tee imported-plugin-release-qualification.log
      - name: Qualify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: build/imported-plugin-release-qualification/Release/digitor_imported_plugin_release_qualification.exe | Tee-Object -FilePath imported-plugin-release-qualification.log
      - uses: actions/upload-artifact@v4
        with:
          name: imported-plugin-release-qualification-${{ runner.os }}
          path: imported-plugin-release-qualification.log
          if-no-files-found: error
