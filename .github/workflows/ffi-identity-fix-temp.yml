name: FFI primary wheels identity fix

on:
  push:
    branches:
      - agent/internal-digitor-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve package
        working-directory: dart/digitor_engine_ffi
        run: flutter pub get
      - name: Fix Primary Wheels native identity defaults and test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          graph = Path('dart/digitor_engine_ffi/lib/src/node_graph.dart')
          text = graph.read_text()
          old = "    this.lift = const DigitorPrimaryWheelValue(),\n    this.gamma = const DigitorPrimaryWheelValue(),\n    this.gain = const DigitorPrimaryWheelValue(),\n    this.offset = const DigitorPrimaryWheelValue(),"
          new = "    this.lift = const DigitorPrimaryWheelValue(master: 0),\n    this.gamma = const DigitorPrimaryWheelValue(master: 1),\n    this.gain = const DigitorPrimaryWheelValue(master: 1),\n    this.offset = const DigitorPrimaryWheelValue(master: 0),"
          if old not in text:
              raise SystemExit('Primary Wheels defaults block not found')
          graph.write_text(text.replace(old, new, 1))
          test = Path('dart/digitor_engine_ffi/test/engine_public_api_test.dart')
          t = test.read_text()
          if "primary wheels default to native identity values" not in t:
              addition = "\n  test('primary wheels default to native identity values', () {\n    const wheels = DigitorPrimaryWheels();\n\n    expect(wheels.lift.master, 0);\n    expect(wheels.gamma.master, 1);\n    expect(wheels.gain.master, 1);\n    expect(wheels.offset.master, 0);\n  });\n"
              pos = t.rfind('\n}')
              if pos < 0:
                  raise SystemExit('test file closing brace not found')
              test.write_text(t[:pos] + addition + t[pos:])
          PY
      - name: Format package
        working-directory: dart/digitor_engine_ffi
        run: dart format lib test
      - name: Analyze package
        working-directory: dart/digitor_engine_ffi
        run: flutter analyze --fatal-infos
      - name: Test package
        working-directory: dart/digitor_engine_ffi
        run: flutter test
      - name: Commit verified identity fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/ffi-identity-fix-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dart/digitor_engine_ffi/lib/src/node_graph.dart dart/digitor_engine_ffi/test/engine_public_api_test.dart .github/workflows/ffi-identity-fix-temp.yml
          git commit -m 'Fix Primary Wheels Flutter identity defaults'
          git push origin HEAD:agent/internal-digitor-integration
