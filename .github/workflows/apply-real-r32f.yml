name: Apply Real R32F Backend Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/real-vulkan-d3d12-r32f
          fetch-depth: 0

      - name: Apply source patch
        run: python3 tools/apply_real_r32f_patch.py

      - name: Commit production sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gpu/gpu_backend.hpp src/gpu/d3d12_backend.cpp src/gpu/vulkan_backend.cpp
          git diff --cached --check
          git commit -m "Implement real Vulkan and D3D12 R32F node masks"
          git push origin HEAD:agent/real-vulkan-d3d12-r32f
