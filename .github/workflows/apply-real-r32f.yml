name: Apply Real R32F Backend Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/real-vulkan-d3d12-r32f
          fetch-depth: 0

      - name: Reconstruct and verify source patch
        run: |
          cat tools/r32f_patch_chunks/chunk_*.b64 | base64 --decode > /tmp/real-r32f.patch
          echo "8b3340d31bf6e8e18e1bfc9074607801870439e2a72ea44eee08122b65fac966  /tmp/real-r32f.patch" | sha256sum --check
          git apply --check /tmp/real-r32f.patch
          git apply /tmp/real-r32f.patch
          git diff --check

      - name: Commit production sources and remove applicator
        run: |
          rm -rf tools/apply_real_r32f_patch.py tools/r32f_patch_chunks .github/workflows/apply-real-r32f.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement real Vulkan and D3D12 R32F node masks"
          git push origin HEAD:agent/real-vulkan-d3d12-r32f
