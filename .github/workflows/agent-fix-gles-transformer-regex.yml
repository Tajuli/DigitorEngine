name: Agent fix GLES transformer regex

on:
  push:
    branches:
      - agent/gles-rgba16f-node-compat
    paths:
      - .github/workflows/agent-fix-gles-transformer-regex.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gles-rgba16f-node-compat
          fetch-depth: 0
      - name: Allow whitespace between raw shader definitions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/agent_patch_gles_rgba16f_node_compat.py')
          s=p.read_text()
          old="rf'constexpr std::string_view {re.escape(name)} = R\"\\(.*?\\)\";\\n(?=constexpr std::string_view {re.escape(next_name)})'"
          new="rf'constexpr std::string_view {re.escape(name)} = R\"\\(.*?\\)\";\\n\\s*(?=constexpr std::string_view {re.escape(next_name)})'"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit transformer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/agent_patch_gles_rgba16f_node_compat.py
          git diff --cached --check
          git commit -m "Fix GLES node transformer shader matching"
          git push origin HEAD:agent/gles-rgba16f-node-compat
