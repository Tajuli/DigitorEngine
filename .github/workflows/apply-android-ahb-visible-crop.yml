name: Apply Android GLES production format patch

on:
  push:
    branches:
      - fix/android-source-preview-fallback
    paths:
      - .github/workflows/apply-android-ahb-visible-crop.yml
  pull_request:
    branches:
      - agent/fix-android-native-assets-ninja-20260818
    paths:
      - .github/workflows/apply-android-ahb-visible-crop.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-source-preview-fallback
          fetch-depth: 0

      - name: Apply asserted Android GLES production-format patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1))

          engine = Path('src/platform/android/android_engine_production.cpp')
          replace_once(
              engine,
              '      options.render_format = DIGITOR_PIXEL_FORMAT_RGBA16_FLOAT;',
              '      options.render_format = DIGITOR_PIXEL_FORMAT_RGBA32_FLOAT;',
          )

          gles = Path('src/gpu/gles_backend.cpp')
          replace_once(
              gles,
              'request.output_format != DIGITOR_PIXEL_FORMAT_RGBA16_FLOAT ||\n        request.working_color_space != "linear-rgba")',
              'request.output_format != DIGITOR_PIXEL_FORMAT_RGBA32_FLOAT ||\n        request.working_color_space != "linear-rgba")',
          )
          replace_once(
              gles,
              'GpuFailurePoint::OutputResourceStorage, GL_RGBA16F,\n                      static_cast<GLsizei>(descriptor.width),\n                      static_cast<GLsizei>(descriptor.height),\n                      "Android AHardwareBuffer RGBA16F output")',
              'GpuFailurePoint::OutputResourceStorage, GL_RGBA32F,\n                      static_cast<GLsizei>(descriptor.width),\n                      static_cast<GLsizei>(descriptor.height),\n                      "Android AHardwareBuffer RGBA32F output")',
          )
          replace_once(
              gles,
              'GpuFrameMetadata{descriptor.width, descriptor.height,\n                         DIGITOR_PIXEL_FORMAT_RGBA16_FLOAT,',
              'GpuFrameMetadata{descriptor.width, descriptor.height,\n                         DIGITOR_PIXEL_FORMAT_RGBA32_FLOAT,',
          )

          dart = Path('dart/digitor_engine_ffi/lib/src/registered_production_session.dart')
          old = '''  if (rendererBackend == DigitorBackend.direct3D12.nativeValue) {
    return DigitorDefaultExportFrameContract(
      workingFormat: DigitorPixelFormat.rgba32Float.nativeValue,
      colorMetadata: 'linear-rgba32f',
    );
  }
  return DigitorDefaultExportFrameContract(
    workingFormat: DigitorPixelFormat.rgba16Float.nativeValue,
    colorMetadata: 'linear-rgba',
  );'''
          new = '''  if (rendererBackend == DigitorBackend.direct3D12.nativeValue) {
    return DigitorDefaultExportFrameContract(
      workingFormat: DigitorPixelFormat.rgba32Float.nativeValue,
      colorMetadata: 'linear-rgba32f',
    );
  }
  if (rendererBackend == DigitorBackend.openGles.nativeValue) {
    return DigitorDefaultExportFrameContract(
      workingFormat: DigitorPixelFormat.rgba32Float.nativeValue,
      colorMetadata: 'linear-rgba',
    );
  }
  return DigitorDefaultExportFrameContract(
    workingFormat: DigitorPixelFormat.rgba16Float.nativeValue,
    colorMetadata: 'linear-rgba',
  );'''
          replace_once(dart, old, new)

      - name: Commit Android GLES format fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/android/android_engine_production.cpp src/gpu/gles_backend.cpp dart/digitor_engine_ffi/lib/src/registered_production_session.dart
          git diff --cached --check
          git commit -m "Align Android GLES frozen export frame format"
          git push origin HEAD:fix/android-source-preview-fallback
