name: Apply Android GLES production format patch

on:
  push:
    branches:
      - fix/android-source-preview-fallback
    paths:
      - .github/workflows/apply-android-ahb-visible-crop.yml
  pull_request:
    branches:
      - agent/fix-android-native-assets-ninja-20260818
    paths:
      - .github/workflows/apply-android-ahb-visible-crop.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-source-preview-fallback
          fetch-depth: 0

      - name: Apply idempotent Android GLES production-format patch
        shell: python
        run: |
          from pathlib import Path

          def ensure(path, old, new):
              text = path.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected old or new text exactly once; old matches={count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1))

          engine = Path('src/platform/android/android_engine_production.cpp')
          ensure(
              engine,
              '      options.render_format = DIGITOR_PIXEL_FORMAT_RGBA16_FLOAT;',
              '      options.render_format = DIGITOR_PIXEL_FORMAT_RGBA32_FLOAT;',
          )

          gles = Path('src/gpu/gles_backend.cpp')
          ensure(
              gles,
              'request.output_format != DIGITOR_PIXEL_FORMAT_RGBA16_FLOAT ||\n        request.working_color_space != "linear-rgba")',
              'request.output_format != DIGITOR_PIXEL_FORMAT_RGBA32_FLOAT ||\n        request.working_color_space != "linear-rgba")',
          )
          ensure(
              gles,
              'GpuFailurePoint::OutputResourceStorage, GL_RGBA16F,\n                      static_cast<GLsizei>(descriptor.width),\n                      static_cast<GLsizei>(descriptor.height),\n                      "Android AHardwareBuffer RGBA16F output")',
              'GpuFailurePoint::OutputResourceStorage, GL_RGBA32F,\n                      static_cast<GLsizei>(descriptor.width),\n                      static_cast<GLsizei>(descriptor.height),\n                      "Android AHardwareBuffer RGBA32F output")',
          )
          ensure(
              gles,
              'GpuFrameMetadata{descriptor.width, descriptor.height,\n                         DIGITOR_PIXEL_FORMAT_RGBA16_FLOAT,',
              'GpuFrameMetadata{descriptor.width, descriptor.height,\n                         DIGITOR_PIXEL_FORMAT_RGBA32_FLOAT,',
          )

          dart = Path('dart/digitor_engine_ffi/lib/src/registered_production_session.dart')
          old_contract = '''  if (rendererBackend == DigitorBackend.direct3D12.nativeValue) {
    return DigitorDefaultExportFrameContract(
      workingFormat: DigitorPixelFormat.rgba32Float.nativeValue,
      colorMetadata: 'linear-rgba32f',
    );
  }
  return DigitorDefaultExportFrameContract(
    workingFormat: DigitorPixelFormat.rgba16Float.nativeValue,
    colorMetadata: 'linear-rgba',
  );'''
          new_contract = '''  if (rendererBackend == DigitorBackend.direct3D12.nativeValue) {
    return DigitorDefaultExportFrameContract(
      workingFormat: DigitorPixelFormat.rgba32Float.nativeValue,
      colorMetadata: 'linear-rgba32f',
    );
  }
  if (rendererBackend == DigitorBackend.openGles.nativeValue) {
    return DigitorDefaultExportFrameContract(
      workingFormat: DigitorPixelFormat.rgba32Float.nativeValue,
      colorMetadata: 'linear-rgba',
    );
  }
  return DigitorDefaultExportFrameContract(
    workingFormat: DigitorPixelFormat.rgba16Float.nativeValue,
    colorMetadata: 'linear-rgba',
  );'''
          ensure(dart, old_contract, new_contract)

          test = Path('dart/digitor_engine_ffi/test/registered_production_export_contract_test.dart')
          old_test = '''  test('non-D3D12 export defaults preserve the existing contract', () {
    for (final backend in <DigitorBackend>[
      DigitorBackend.vulkan,
      DigitorBackend.metal,
      DigitorBackend.openGles,
    ]) {
      final contract = digitorDefaultExportFrameContract(backend.nativeValue);
      expect(
        contract.workingFormat,
        DigitorPixelFormat.rgba16Float.nativeValue,
      );
      expect(contract.colorMetadata, 'linear-rgba');
    }
  });'''
          new_test = '''  test('OpenGL ES export defaults match canonical processed GPU frames', () {
    final contract = digitorDefaultExportFrameContract(
      DigitorBackend.openGles.nativeValue,
    );
    expect(contract.workingFormat, DigitorPixelFormat.rgba32Float.nativeValue);
    expect(contract.colorMetadata, 'linear-rgba');
  });

  test('other non-D3D12 export defaults preserve the existing contract', () {
    for (final backend in <DigitorBackend>[
      DigitorBackend.vulkan,
      DigitorBackend.metal,
    ]) {
      final contract = digitorDefaultExportFrameContract(backend.nativeValue);
      expect(
        contract.workingFormat,
        DigitorPixelFormat.rgba16Float.nativeValue,
      );
      expect(contract.colorMetadata, 'linear-rgba');
    }
  });'''
          ensure(test, old_test, new_test)

      - name: Commit Android GLES format fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/android/android_engine_production.cpp src/gpu/gles_backend.cpp dart/digitor_engine_ffi/lib/src/registered_production_session.dart dart/digitor_engine_ffi/test/registered_production_export_contract_test.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Android GLES production format already aligned"
            exit 0
          fi
          git commit -m "Align Android GLES frozen export frame format"
          git push origin HEAD:fix/android-source-preview-fallback
