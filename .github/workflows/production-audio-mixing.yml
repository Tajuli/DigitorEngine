name: Production Audio Mixing

on:
  pull_request:
    paths:
      - 'include/digitor/production_audio_mixing.hpp'
      - 'src/audio/production_audio_mixing.cpp'
      - 'tests/production_audio_mixing/**'
      - '.github/workflows/production-audio-mixing.yml'
  push:
    branches: [main]

jobs:
  qualify:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/production_audio_mixing -B build/audio-mixing -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/audio-mixing --config Release --parallel 2
      - name: Test Unix
        if: runner.os != 'Windows'
        run: ./build/audio-mixing/digitor_production_audio_mixing
      - name: Test Windows
        if: runner.os == 'Windows'
        run: .\build\audio-mixing\Release\digitor_production_audio_mixing.exe
