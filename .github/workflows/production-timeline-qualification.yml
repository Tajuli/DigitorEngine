name: Production Timeline Qualification

on:
  pull_request:
    paths:
      - 'include/digitor/production_timeline*.hpp'
      - 'include/digitor/timeline.hpp'
      - 'src/editor/production_timeline*.cpp'
      - 'src/editor/timeline.cpp'
      - 'tests/production_timeline*_tests.cpp'
      - 'production_timeline/**'
      - 'docs/production_timeline_v5_1.md'
      - '.github/workflows/production-timeline-qualification.yml'
  workflow_dispatch:

jobs:
  contract-runtime-playback:
    name: Contract runtime playback (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S production_timeline/contract -B build-production-timeline
      - name: Build
        run: cmake --build build-production-timeline --config Release --parallel 2
      - name: Test all timeline contracts
        run: ctest --test-dir build-production-timeline -C Release --output-on-failure
      - name: Stress repeat playback contract
        shell: bash
        run: |
          for i in $(seq 1 20); do
            ctest --test-dir build-production-timeline -C Release -R playback --output-on-failure
          done

  qualification-policy:
    name: Qualification policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce playback integration scope
        shell: bash
        run: |
          test -f include/digitor/production_timeline_playback.hpp
          test -f src/editor/production_timeline_playback.cpp
          test -f tests/production_timeline_playback_tests.cpp
          grep -q 'latest-request-wins' docs/production_timeline_v5_1.md
          grep -q 'seek epoch' docs/production_timeline_v5_1.md
          grep -q 'preview/export plan identity' docs/production_timeline_v5_1.md
          grep -q 'revision-aware plan cache' docs/production_timeline_v5_1.md
