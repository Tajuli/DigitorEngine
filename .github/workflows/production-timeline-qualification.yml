name: Production Timeline Qualification

on:
  pull_request:
    paths:
      - 'include/digitor/production_timeline*.hpp'
      - 'include/digitor/timeline.hpp'
      - 'src/editor/production_timeline*.cpp'
      - 'src/editor/timeline.cpp'
      - 'tests/production_timeline*_tests.cpp'
      - 'production_timeline/**'
      - 'docs/production_timeline_v5_1.md'
      - '.github/workflows/production-timeline-qualification.yml'
  workflow_dispatch:

jobs:
  contract-and-runtime:
    name: Contract and runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S production_timeline/contract -B build-production-timeline
      - name: Build
        run: cmake --build build-production-timeline --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-production-timeline -C Release --output-on-failure

  qualification-policy:
    name: Qualification policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce integration scope and merge gates
        shell: bash
        run: |
          test -f include/digitor/production_timeline_runtime.hpp
          test -f src/editor/production_timeline_runtime.cpp
          test -f tests/production_timeline_runtime_tests.cpp
          grep -q 'Legacy Timeline snapshot compiler' docs/production_timeline_v5_1.md
          grep -q 'Monotonic revision publication' docs/production_timeline_v5_1.md
          grep -q 'Decode/render execution plan' docs/production_timeline_v5_1.md
          grep -q 'Audio mix-block plan' docs/production_timeline_v5_1.md
