name: Plugin GPU Multi-Pass Runtime

on:
  pull_request:
    paths:
      - 'include/digitor/plugin_gpu_multipass.hpp'
      - 'src/plugin/plugin_gpu_multipass.cpp'
      - 'tests/plugin_gpu_multipass/**'
      - '.github/workflows/plugin-gpu-multipass.yml'
  workflow_dispatch:

jobs:
  qualify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/plugin_gpu_multipass -B build/plugin-gpu-multipass -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/plugin-gpu-multipass --config Release --parallel 2
      - name: Qualify on Unix
        if: runner.os != 'Windows'
        run: build/plugin-gpu-multipass/digitor_plugin_gpu_multipass_qualification | tee plugin-gpu-multipass.log
      - name: Qualify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: build/plugin-gpu-multipass/Release/digitor_plugin_gpu_multipass_qualification.exe | Tee-Object -FilePath plugin-gpu-multipass.log
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-gpu-multipass-${{ runner.os }}
          path: plugin-gpu-multipass.log
          if-no-files-found: error
