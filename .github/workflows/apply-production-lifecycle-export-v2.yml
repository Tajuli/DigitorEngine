name: Apply production lifecycle export V2 patch

on:
  push:
    branches:
      - agent/production-lifecycle-export-v2
    paths:
      - .github/workflows/apply-production-lifecycle-export-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-lifecycle-export-v2
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .agent-export-v2.patch.gz.b64 | gzip -dc > /tmp/production-lifecycle-export-v2.patch
          git apply -p2 --check /tmp/production-lifecycle-export-v2.patch
          git apply -p2 /tmp/production-lifecycle-export-v2.patch

      - name: Format Dart FFI changes
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            dart/digitor_engine_ffi/lib/src/editor_workspace.dart \
            dart/digitor_engine_ffi/lib/src/native_production_api.dart \
            dart/digitor_engine_ffi/lib/src/registered_production_session.dart

      - name: Qualify production lifecycle changes
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-agent -DDIGITOR_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-agent -j2 --target \
            digitor_production_media_graph_runtime_test \
            digitor_flutter_production_host_adapter_test \
            digitor_flutter_production_plugin_bootstrap_test \
            digitor_production_hardware_encode_test
          ctest --test-dir build-agent --output-on-failure -R 'digitor_(production_media_graph_runtime|flutter_production_host_adapter|flutter_production_plugin_bootstrap|production_hardware_encode)'

      - name: Publish clean source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-agent
          rm -f .agent-export-v2.patch.gz.b64
          rm -f .github/workflows/apply-production-lifecycle-export-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 14
          git commit -m 'Decouple preview attach from frozen export lifecycle'
          git push origin HEAD:agent/production-lifecycle-export-v2
