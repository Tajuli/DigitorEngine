name: Flutter Plugin Qualification

on:
  pull_request:
    paths:
      - 'dart/digitor_engine_ffi/**'
      - 'include/digitor/native_node_backend_runtime.hpp'
      - 'include/digitor/native_node_platform_factories.hpp'
      - 'src/gpu/native_node_platform_factories.cpp'
      - 'src/gpu/native_node_metal_factory.mm'
      - 'src/gpu/vulkan_backend.cpp'
      - 'src/gpu/node_graph.cpp'
      - '.github/workflows/flutter-plugin-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/flutter-platform-hosts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply portable Vulkan handle calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/gpu/vulkan_backend.cpp')
          content = path.read_text()
          replacements = [
              ('static_cast<NativeNodeNativeHandle>(texture.view)',
               'encode_native_node_handle(texture.view)'),
              ('static_cast<NativeNodeNativeHandle>(descriptor_pool)',
               'encode_native_node_handle(descriptor_pool)'),
          ]
          changed = False
          for old, new in replacements:
              if old in content:
                  if content.count(old) != 1:
                      raise SystemExit(f'Expected exactly one occurrence of {old}')
                  content = content.replace(old, new)
                  changed = True
              elif new not in content:
                  raise SystemExit(f'Neither old nor portable expression found: {old}')
          if changed:
              path.write_text(content)
          PY
          if git diff --quiet -- src/gpu/vulkan_backend.cpp; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gpu/vulkan_backend.cpp
          git commit -m "Use portable Vulkan native handle encoding"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  package-contract:
    needs: source-fix
    if: always() && needs.source-fix.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: dart/digitor_engine_ffi
        run: flutter pub get
      - working-directory: dart/digitor_engine_ffi
        run: dart format lib test hook
      - working-directory: dart/digitor_engine_ffi
        run: flutter analyze --fatal-infos
      - working-directory: dart/digitor_engine_ffi
        run: flutter test
      - name: Verify production host sources
        run: |
          test -f dart/digitor_engine_ffi/android/src/main/kotlin/com/primedigitor/digitor_engine_ffi/DigitorEngineFfiPlugin.kt
          test -f dart/digitor_engine_ffi/android/src/main/cpp/platform_host_jni.cpp
          test -f dart/digitor_engine_ffi/windows/digitor_engine_ffi_plugin.cpp
          test -f dart/digitor_engine_ffi/ios/Classes/DigitorEngineFfiPlugin.mm
          test -f dart/digitor_engine_ffi/macos/Classes/DigitorEngineFfiPlugin.mm
          grep -q 'DIGITOR_ENABLE_FFMPEG=ON' dart/digitor_engine_ffi/hook/build.dart
          grep -q 'DIGITOR_ENABLE_OCIO=ON' dart/digitor_engine_ffi/hook/build.dart
          grep -q 'DIGITOR_ENABLE_NATIVE_SHADER_COMPILER=ON' dart/digitor_engine_ffi/hook/build.dart

  android-host:
    needs: source-fix
    if: always() && needs.source-fix.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android integration app
        shell: bash
        run: |
          flutter create --empty --platforms=android "$RUNNER_TEMP/digitor_host_app"
          cd "$RUNNER_TEMP/digitor_host_app"
          flutter pub add digitor_engine_ffi --path "$GITHUB_WORKSPACE/dart/digitor_engine_ffi"
          flutter build apk --debug

  windows-host:
    needs: source-fix
    if: always() && needs.source-fix.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Windows integration app
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --empty --platforms=windows "$env:RUNNER_TEMP\digitor_host_app"
          Set-Location "$env:RUNNER_TEMP\digitor_host_app"
          flutter pub add digitor_engine_ffi --path "$env:GITHUB_WORKSPACE\dart\digitor_engine_ffi"
          flutter build windows --debug

  apple-hosts:
    needs: source-fix
    if: always() && needs.source-fix.result == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Apple integration app
        shell: bash
        run: |
          flutter config --enable-macos-desktop
          flutter create --empty --platforms=ios,macos "$RUNNER_TEMP/digitor_host_app"
          cd "$RUNNER_TEMP/digitor_host_app"
          python3 - <<'PY'
          from pathlib import Path
          import re

          def set_project_target(path, pattern, replacement):
              original = path.read_text()
              updated, count = re.subn(pattern, replacement, original)
              if count == 0:
                  raise SystemExit(f'Could not update deployment target in {path}')
              path.write_text(updated)

          def set_pod_platform(path, platform, version):
              if not path.exists():
                  raise SystemExit(f'Missing generated Podfile: {path}')
              original = path.read_text()
              pattern = rf"^\s*#?\s*platform\s+:{platform},\s*['\"][^'\"]+['\"]\s*$"
              replacement = f"platform :{platform}, '{version}'"
              updated, count = re.subn(pattern, replacement, original,
                                       flags=re.MULTILINE)
              if count == 0:
                  updated = replacement + '\n' + original
              path.write_text(updated)

          set_project_target(
              Path('macos/Runner.xcodeproj/project.pbxproj'),
              r'MACOSX_DEPLOYMENT_TARGET = [^;]+;',
              'MACOSX_DEPLOYMENT_TARGET = 11.0;')
          set_project_target(
              Path('ios/Runner.xcodeproj/project.pbxproj'),
              r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 13.0;')
          set_pod_platform(Path('macos/Podfile'), 'osx', '11.0')
          set_pod_platform(Path('ios/Podfile'), 'ios', '13.0')
          PY
          grep -n "platform :osx, '11.0'" macos/Podfile
          grep -n "platform :ios, '13.0'" ios/Podfile
          flutter pub add digitor_engine_ffi --path "$GITHUB_WORKSPACE/dart/digitor_engine_ffi"
          flutter build macos --debug
          flutter build ios --debug --no-codesign