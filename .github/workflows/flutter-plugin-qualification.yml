name: Flutter Plugin Qualification

on:
  pull_request:
    paths:
      - 'dart/digitor_engine_ffi/**'
      - 'include/digitor/native_node_backend_runtime.hpp'
      - 'include/digitor/native_node_platform_factories.hpp'
      - 'src/gpu/native_node_platform_factories.cpp'
      - 'src/gpu/native_node_metal_factory.mm'
      - 'src/gpu/vulkan_backend.cpp'
      - 'src/gpu/node_graph.cpp'
      - 'src/gpu/shader.cpp'
      - '.github/workflows/flutter-plugin-qualification.yml'

permissions:
  contents: write

jobs:
  source-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/flutter-platform-hosts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Make shell compiler helper unavailable on iOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/gpu/shader.cpp')
          content = path.read_text()

          include_old = '#include <thread>\n'
          include_new = '''#include <thread>\n\n#if defined(__APPLE__)\n#include <TargetConditionals.h>\n#endif\n'''
          if include_new not in content:
              if content.count(include_old) != 1:
                  raise SystemExit('Expected exactly one <thread> include')
              content = content.replace(include_old, include_new)

          function_old = '''int run_shell_command(const std::string& command){\n#ifdef _WIN32\n    const std::string wrapped = "\\\"" + command + "\\\"";\n    return std::system(wrapped.c_str());\n#else\n    return std::system(command.c_str());\n#endif\n}\n'''
          function_new = '''int run_shell_command(const std::string& command){\n#if defined(__APPLE__) && TARGET_OS_IPHONE\n    (void)command;\n    return -1;\n#elif defined(_WIN32)\n    const std::string wrapped = "\\\"" + command + "\\\"";\n    return std::system(wrapped.c_str());\n#else\n    return std::system(command.c_str());\n#endif\n}\n'''
          if function_new not in content:
              if content.count(function_old) != 1:
                  raise SystemExit('Expected exactly one run_shell_command implementation')
              content = content.replace(function_old, function_new)

          path.write_text(content)
          PY
          if git diff --quiet -- src/gpu/shader.cpp; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gpu/shader.cpp
          git commit -m "Make external shader compiler safe on iOS"
          git push origin "HEAD:${GITHUB_HEAD_REF}"