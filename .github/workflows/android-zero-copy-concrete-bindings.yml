name: Android Zero-Copy Concrete Bindings

on:
  pull_request:
    paths:
      - 'include/digitor/android_zero_copy_concrete_bindings.hpp'
      - 'src/media/android_zero_copy_concrete_bindings.cpp'
      - 'tests/android_zero_copy_concrete_bindings_tests.cpp'
      - 'cmake/AndroidZeroCopyConcreteBindings.cmake'
      - 'android_zero_copy/concrete/**'
      - '.github/workflows/android-zero-copy-concrete-bindings.yml'
  workflow_dispatch:

jobs:
  hosted-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S android_zero_copy/concrete -B build-android-concrete -DDIGITOR_BUILD_ANDROID_ZERO_COPY_CONCRETE_BINDINGS=ON
      - name: Build
        run: cmake --build build-android-concrete --parallel 2
      - name: Test
        run: ctest --test-dir build-android-concrete --output-on-failure

  android-device-lab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, android, digitor-gpu-lab]
    steps:
      - uses: actions/checkout@v4
      - name: Require Android NDK
        shell: bash
        run: test -n "$ANDROID_NDK_HOME"
      - name: Configure Android arm64
        shell: bash
        run: >-
          cmake -S android_zero_copy/concrete -B build-android-device
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29
          -DDIGITOR_BUILD_ANDROID_ZERO_COPY_CONCRETE_BINDINGS=ON
      - name: Build Android bindings
        run: cmake --build build-android-device --parallel 2
      - name: Device qualification hook
        shell: bash
        run: |
          test -n "$DIGITOR_ANDROID_DEVICE_SERIAL"
          echo "Run MediaCodec/AHardwareBuffer Vulkan-GLES qualification on $DIGITOR_ANDROID_DEVICE_SERIAL"
