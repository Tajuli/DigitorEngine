name: Windows Vulkan Effects Provider

on:
  pull_request:
    paths:
      - 'include/digitor/windows_vulkan_effect_provider.hpp'
      - 'src/platform/windows/windows_vulkan_effect_provider.cpp'
      - 'cmake/WindowsVulkanEffects.cmake'
      - 'tests/windows_vulkan_effect_provider/**'
      - '.github/workflows/windows-vulkan-effects-provider.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --yes --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK installation directory was not found' }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Test-Path "$($sdk.FullName)\Include\vulkan\vulkan.h")) {
            throw 'Vulkan headers were not installed'
          }
          if (-not (Test-Path "$($sdk.FullName)\Lib\vulkan-1.lib")) {
            throw 'Vulkan import library was not installed'
          }
      - name: Configure provider qualification
        shell: pwsh
        run: cmake -S tests/windows_vulkan_effect_provider -B build/windows-vulkan-effects -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build provider qualification
        shell: pwsh
        run: cmake --build build/windows-vulkan-effects --config Release --parallel 2
      - name: Run fail-closed contract test
        shell: pwsh
        run: build/windows-vulkan-effects/Release/digitor_windows_vulkan_effect_provider_qualification.exe | Tee-Object -FilePath windows-vulkan-effects-provider.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows-vulkan-effects-provider
          path: windows-vulkan-effects-provider.log
          if-no-files-found: error
