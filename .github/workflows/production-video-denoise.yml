name: Production Video Denoise
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/production_video_denoise -B build/video-denoise -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/video-denoise --config Release --parallel 2
      - name: Test Unix
        if: runner.os != 'Windows'
        run: build/video-denoise/digitor_production_video_denoise
      - name: Test Windows
        if: runner.os == 'Windows'
        run: build/video-denoise/Release/digitor_production_video_denoise.exe
