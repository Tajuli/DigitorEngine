name: Apply Windows Preview Runtime Patch

on:
  push:
    branches:
      - agent/complete-windows-d3d12-production-preview
    paths:
      - '.github/agent/windows_preview_runtime.patch.gz.b64'
      - '.github/workflows/apply-windows-preview-runtime.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-windows-d3d12-production-preview
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          base64 -d .github/agent/windows_preview_runtime.patch.gz.b64 | gzip -d > /tmp/windows-preview-runtime.patch
          git apply --check /tmp/windows-preview-runtime.patch
          git apply /tmp/windows-preview-runtime.patch
          rm -f .github/agent/windows_preview_runtime.patch.gz.b64
          rm -f .github/workflows/apply-windows-preview-runtime.yml
      - name: Commit clean source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete engine-owned Windows D3D12 preview bootstrap'
          git push origin HEAD:agent/complete-windows-d3d12-production-preview
