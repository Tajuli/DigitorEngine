name: Apple Metal P010

on:
  pull_request:
  workflow_dispatch:

jobs:
  macos-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S apple_metal_p010/contract -B build-apple-metal-p010
      - name: Build focused target
        run: cmake --build build-apple-metal-p010 --target digitor_apple_metal_p010_tests --parallel 2
      - name: Test focused contract
        run: ctest --test-dir build-apple-metal-p010 -R '^digitor_apple_metal_p010_tests$' --output-on-failure

  apple-gpu-lab:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, macOS, digitor-apple-gpu-lab]
    steps:
      - uses: actions/checkout@v4
      - name: Qualify Metal P010 production path
        run: ./scripts/run_apple_metal_p010_qualification.sh
