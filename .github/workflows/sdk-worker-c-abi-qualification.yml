name: SDK Worker C ABI Qualification

on:
  pull_request:
    paths:
      - 'include/digitor/sdk_worker_c_api.h'
      - 'include/digitor/sdk_media_worker.hpp'
      - 'include/digitor/async_operation.hpp'
      - 'src/ffi/sdk_worker_c_api.cpp'
      - 'src/runtime/sdk_media_worker.cpp'
      - 'src/runtime/async_operation.cpp'
      - 'tests/sdk_worker_c_api_tests.cpp'
      - '.github/workflows/sdk-worker-c-abi-qualification.yml'
  workflow_dispatch:

jobs:
  qualify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build and run (Unix)
        if: runner.os != 'Windows'
        run: |
          c++ -std=c++20 -pthread -Wall -Wextra -Wpedantic -Werror -Iinclude src/runtime/async_operation.cpp src/runtime/sdk_media_worker.cpp src/ffi/sdk_worker_c_api.cpp tests/sdk_worker_c_api_tests.cpp -o sdk_worker_c_api_tests
          ./sdk_worker_c_api_tests
      - name: Build and run (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /WX /DDIGITOR_ENGINE_STATIC /Iinclude src\runtime\async_operation.cpp src\runtime\sdk_media_worker.cpp src\ffi\sdk_worker_c_api.cpp tests\sdk_worker_c_api_tests.cpp /Fe:sdk_worker_c_api_tests.exe
          sdk_worker_c_api_tests.exe
