name: Android Physical GPU Qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'include/digitor/android_gpu_qualification.hpp'
      - 'src/gpu/android_gpu_qualification.cpp'
      - 'tests/android_gpu_qualification/**'
      - 'tests/android_physical_runtime/**'
      - 'shaders/vulkan/android_physical_yuv_to_rgba16f.comp'
      - 'tools/android-production-qualification.sh'
      - 'tools/android-physical-release-qualification.ps1'
      - '.github/workflows/android-physical-gpu-qualification.yml'
  push:
    branches: [main]

jobs:
  contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/android_gpu_qualification -B build/android-gpu -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/android-gpu --config Release --parallel 2
      - if: runner.os != 'Windows'
        run: ./build/android-gpu/digitor_android_gpu_qualification
      - if: runner.os == 'Windows'
        run: .\build\android-gpu\Release\digitor_android_gpu_qualification.exe

  arm64-physical-harness-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile qualification shader
        run: |
          "$ANDROID_NDK_HOME/shader-tools/linux-x86_64/glslc" \
            -fshader-stage=compute \
            shaders/vulkan/android_physical_yuv_to_rgba16f.comp \
            -o /tmp/android-physical-yuv-to-rgba16f.spv
      - name: Configure Android arm64 physical harness
        run: |
          cmake -S tests/android_physical_runtime \
            -B build/android-physical-runtime \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build Android arm64 physical harness
        run: cmake --build build/android-physical-runtime --parallel 2

  physical-device:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, android, digitor-gpu]
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/android-production-qualification.sh
