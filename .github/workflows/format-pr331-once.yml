name: Format PR 331 Once

on:
  push:
    branches:
      - agent/flutter-platform-hosts
    paths:
      - '.github/workflows/format-pr331-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flutter-platform-hosts
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply canonical Dart format
        working-directory: dart/digitor_engine_ffi
        run: dart format lib/src/platform_host.dart test/platform_host_test.dart
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dart/digitor_engine_ffi/lib/src/platform_host.dart dart/digitor_engine_ffi/test/platform_host_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "Format Flutter platform host Dart sources"
          git push origin HEAD:agent/flutter-platform-hosts
