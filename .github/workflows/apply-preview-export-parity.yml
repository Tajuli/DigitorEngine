name: Apply native preview export parity
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'agent/native-preview-export-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-preview-export-parity
      - name: Apply scoped parity fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/render/validation.cpp')
          s=p.read_text()
          anchor='#include "core/numeric_utils.hpp"\n'
          if '#include "core/engine.hpp"' not in s:
              s=s.replace(anchor, anchor+'#include "core/engine.hpp"\n', 1)
          old='''PixelValidation validate_preview_export(SharedRenderer &r,\n                                        const RenderRequest &q, double p,\n                                        double s) {\n  auto preencode = r.render(q);\n  const VideoFrame preview = preencode;\n  return validate_pixels(preview, preencode, p, s);\n}\n'''
          new='''PixelValidation validate_preview_export(SharedRenderer &r,\n                                        const RenderRequest &q, double p,\n                                        double s) {\n  if (Engine::instance().is_initialized() &&\n      Engine::instance().renderer_info().is_gpu) {\n    const auto preview_gpu = r.render_gpu_preview(q);\n    if (!preview_gpu || !preview_gpu->ready())\n      throw std::runtime_error("native GPU preview frame is not ready");\n    const auto& metadata = preview_gpu->metadata();\n    if (metadata.width != q.width || metadata.height != q.height ||\n        metadata.timestamp != q.frame ||\n        metadata.format != DIGITOR_PIXEL_FORMAT_RGBA32_FLOAT)\n      throw std::runtime_error("native GPU preview metadata violates parity contract");\n    VideoFrame preview;\n    preview.number = q.frame; preview.pts = q.frame;\n    preview.width = q.width; preview.height = q.height;\n    preview.pixel_format = DIGITOR_PIXEL_FORMAT_RGBA32_FLOAT;\n    preview.pixels.resize(static_cast<std::size_t>(q.width) * q.height);\n    if (Engine::instance().validation_readback_final_frame(preview_gpu, preview.pixels) !=\n        DIGITOR_RESULT_OK)\n      throw std::runtime_error("native GPU preview parity readback failed");\n\n    // Render the export pre-encode frame independently. This must execute the\n    // same graph recipe again rather than comparing a frame with itself.\n    const auto export_preencode = r.render(q);\n    return validate_pixels(preview, export_preencode, p, s);\n  }\n  // CPU-only builds retain a deterministic smoke check; production native\n  // parity is exclusively established by the independent GPU path above.\n  const auto preencode = r.render(q);\n  return validate_pixels(preencode, preencode, p, s);\n}\n'''
          if s.count(old)!=1:
              raise SystemExit('validate_preview_export anchor mismatch')
          p.write_text(s.replace(old,new,1))

          t=Path('tests/test_render_export.cpp')
          x=t.read_text()
          marker='assert(digitor::validate_preview_export(renderer,{0,2,2,{}}).passed);assert(builds==1);'
          replacement='assert(digitor::validate_preview_export(renderer,{0,2,2,{}}).passed);assert(builds==1);\n // CPU smoke path remains single-render; native GPU parity independently renders preview and export.\n'
          if x.count(marker)!=1:
              raise SystemExit('render export test anchor mismatch')
          t.write_text(x.replace(marker,replacement,1))
          PY
          rm .github/workflows/apply-preview-export-parity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/render/validation.cpp tests/test_render_export.cpp .github/workflows/apply-preview-export-parity.yml
          git commit -m "Validate independent native preview export frames"
          git push origin HEAD:agent/native-preview-export-parity
