name: Windows D3D12 Effects Qualification

on:
  pull_request:
    paths:
      - 'include/digitor/native_effects.hpp'
      - 'include/digitor/effect_system.hpp'
      - 'include/digitor/windows_d3d12_effect_provider.hpp'
      - 'include/digitor/windows_d3d12_builtin_effect_shaders.hpp'
      - 'src/gpu/native_effects.cpp'
      - 'src/gpu/effect_system.cpp'
      - 'src/platform/windows/windows_d3d12_effect_provider.cpp'
      - 'src/platform/windows/windows_d3d12_builtin_effect_shaders.cpp'
      - 'tests/test_windows_d3d12_effects_qualification.cpp'
      - 'tests/windows_d3d12_effects_qualification/CMakeLists.txt'
      - 'tools/windows-production-qualification.ps1'
      - '.github/workflows/windows-d3d12-effects-qualification.yml'
  workflow_dispatch:

jobs:
  compile-contract:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/windows_d3d12_effects_qualification -B build/d3d12-effects -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/d3d12-effects --config Release --parallel 2

  physical-gpu-qualification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, digitor-gpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Execute production qualification
        shell: pwsh
        run: .\tools\windows-production-qualification.ps1 -SkipFullSuite
      - name: Verify physical GPU evidence
        shell: pwsh
        run: |
          $log = 'artifacts/windows-production-qualification/d3d12-effects.log'
          if (-not (Test-Path $log)) { throw 'D3D12 qualification evidence missing' }
          $required = @(
            'D3D12_EFFECTS_QUALIFICATION=PASS',
            'ADAPTER_CLASS=HARDWARE',
            'CPU_READBACKS=0',
            'CPU_REUPLOADS=0',
            'FALLBACK_DISPATCHES=0'
          )
          foreach ($marker in $required) {
            if (-not (Select-String -Path $log -SimpleMatch $marker -Quiet)) {
              throw "qualification marker missing: $marker"
            }
          }
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-production-qualification
          path: artifacts/windows-production-qualification
          if-no-files-found: error
