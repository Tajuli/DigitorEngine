name: Windows D3D12 Effects Qualification

on:
  pull_request:
    paths:
      - 'include/digitor/native_effects.hpp'
      - 'include/digitor/effect_system.hpp'
      - 'include/digitor/windows_d3d12_effect_provider.hpp'
      - 'include/digitor/windows_d3d12_builtin_effect_shaders.hpp'
      - 'src/gpu/native_effects.cpp'
      - 'src/gpu/effect_system.cpp'
      - 'src/platform/windows/windows_d3d12_effect_provider.cpp'
      - 'src/platform/windows/windows_d3d12_builtin_effect_shaders.cpp'
      - 'tests/test_windows_d3d12_effects_qualification.cpp'
      - 'tests/windows_d3d12_effects_qualification/CMakeLists.txt'
      - '.github/workflows/windows-d3d12-effects-qualification.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/windows_d3d12_effects_qualification -B build/d3d12-effects -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/d3d12-effects --config Release --parallel 2
      - name: Execute qualification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & .\build\d3d12-effects\Release\digitor_windows_d3d12_effects_qualification.exe 2>&1 |
            Tee-Object artifacts\windows-d3d12-effects-qualification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Select-String -Path artifacts\windows-d3d12-effects-qualification.log -Pattern 'D3D12_EFFECTS_QUALIFICATION=PASS' -Quiet |
            ForEach-Object { if (-not $_) { throw 'qualification PASS marker missing' } }
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-d3d12-effects-qualification
          path: artifacts/windows-d3d12-effects-qualification.log
          if-no-files-found: error
