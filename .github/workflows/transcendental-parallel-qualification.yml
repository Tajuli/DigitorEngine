name: Transcendental CPU Parallel Qualification

on:
  pull_request:
    paths:
      - 'src/gpu/color.cpp'
      - 'src/gpu/primary_wheels.cpp'
      - 'src/gpu/log_wheels.cpp'
      - 'tests/transcendental_parallel/**'
      - '.github/workflows/transcendental-parallel-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'src/gpu/color.cpp'
      - 'src/gpu/primary_wheels.cpp'
      - 'src/gpu/log_wheels.cpp'
      - 'tests/transcendental_parallel/**'

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.os }} bit-exact parity
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure
        run: cmake -S tests/transcendental_parallel -B build-transcendental -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-transcendental --config Release --target digitor_transcendental_parallel_test
      - name: Run qualification (Unix)
        if: runner.os != 'Windows'
        run: ./build-transcendental/digitor_transcendental_parallel_test
      - name: Run qualification (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build-transcendental\Release\digitor_transcendental_parallel_test.exe
