name: PR65 apply compile fix
on:
  push:
    branches:
      - agent/real-vulkan-d3d12-r32f
    paths:
      - .github/workflows/pr65-apply-fix.yml
      - .pr65-fix.patch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-vulkan-d3d12-r32f
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          git apply --check .pr65-fix.patch
          git apply .pr65-fix.patch
          rm .pr65-fix.patch .github/workflows/pr65-apply-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/digitor/native_node_mask_backend.hpp src/gpu/gpu_backend.hpp src/gpu/vulkan_backend.cpp src/gpu/d3d12_backend.cpp .pr65-fix.patch .github/workflows/pr65-apply-fix.yml
          git commit -m "fix: repair native node backend compilation"
          git push origin HEAD:agent/real-vulkan-d3d12-r32f
