name: Temp Dart Format

on:
  push:
    branches:
      - agent/flutter-drop-in-sdk

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flutter-drop-in-sdk
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        working-directory: dart/digitor_engine_ffi
        run: flutter pub get
      - name: Format package
        working-directory: dart/digitor_engine_ffi
        run: dart format .
      - name: Commit formatter output
        run: |
          if git diff --quiet -- dart/digitor_engine_ffi; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dart/digitor_engine_ffi
          git commit -m "Format Flutter FFI package"
          git push origin HEAD:agent/flutter-drop-in-sdk
