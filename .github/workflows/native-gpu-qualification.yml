name: Native GPU Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native-gpu-qualification.yml'
      - '.github/workflows/production-native-gpu-signoff.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native-gpu-qualification.yml'
      - '.github/workflows/production-native-gpu-signoff.yml'

permissions:
  contents: read

jobs:
  windows-native:
    name: Windows D3D12 real GPU; Vulkan opportunistic
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -A x64
          -DDIGITOR_ENABLE_FFMPEG=OFF
          -DDIGITOR_BUILD_TESTS=ON
          -DDIGITOR_BUILD_EXAMPLES=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Unit tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure -LE hardware

      - name: Native qualification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qualification | Out-Null
          $env:DIGITOR_GPU_VALIDATION='1'
          & .\build\Release\digitor_native_gpu_tests.exe 2>&1 | Tee-Object qualification\windows-native.log
          $status = $LASTEXITCODE
          $log = Get-Content qualification\windows-native.log -Raw
          if ($status -eq 77) {
            '{"status":"hardware-unavailable","exit_code":77,"production_qualified":false}' | Set-Content qualification\windows-native.json
            Write-Host 'Native GPU hardware is unavailable on this runner; qualification skipped.'
            exit 0
          }
          if ($status -eq 0) {
            $d3d12 = $log -match 'BACKEND RESULT backend=Direct3D12 status=PASS'
            $vulkan = $log -match 'BACKEND RESULT backend=Vulkan status=PASS'
            "{`"status`":`"executed-passed`",`"exit_code`":0,`"d3d12_real_pass`":$($d3d12.ToString().ToLower()),`"vulkan_real_pass`":$($vulkan.ToString().ToLower()),`"full_production_matrix`":false}" | Set-Content qualification\windows-native.json
            if (-not $d3d12) { throw 'Required D3D12 real GPU evidence missing' }
            exit 0
          }
          "{`"status`":`"failed`",`"exit_code`":$status,`"production_qualified`":false}" | Set-Content qualification\windows-native.json
          exit $status

      - name: Upload Windows qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-qualification
          path: qualification/**
          if-no-files-found: warn

  macos-metal:
    name: macOS Metal real GPU
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DDIGITOR_ENABLE_FFMPEG=OFF
          -DDIGITOR_BUILD_TESTS=ON
          -DDIGITOR_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -LE hardware

      - name: Native qualification
        shell: bash
        run: |
          mkdir -p qualification
          set +e
          DIGITOR_GPU_VALIDATION=1 ./build/digitor_native_gpu_tests 2>&1 | tee qualification/macos-metal.log
          status=${PIPESTATUS[0]}
          set -e
          case "$status" in
            0)
              if ! grep -q 'BACKEND RESULT backend=Metal status=PASS' qualification/macos-metal.log; then
                printf '{"status":"failed","reason":"metal-pass-evidence-missing","production_qualified":false}\n' > qualification/macos-metal.json
                exit 1
              fi
              printf '{"status":"executed-passed","exit_code":0,"metal_real_pass":true,"full_production_matrix":false}\n' > qualification/macos-metal.json
              ;;
            77)
              printf '{"status":"hardware-unavailable","exit_code":77,"production_qualified":false}\n' > qualification/macos-metal.json
              echo 'Native GPU hardware is unavailable on this runner; qualification skipped.'
              exit 0
              ;;
            *)
              printf '{"status":"failed","exit_code":%s,"production_qualified":false}\n' "$status" > qualification/macos-metal.json
              exit "$status"
              ;;
          esac

      - name: Upload Metal qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-metal-qualification
          path: qualification/**
          if-no-files-found: warn

  android-compile-link:
    name: Android arm64 compile/link only — not qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        shell: bash
        run: sdkmanager 'ndk;27.2.12479018'

      - name: Configure Android NDK
        shell: bash
        run: >-
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DCMAKE_BUILD_TYPE=Release
          -DDIGITOR_ENABLE_FFMPEG=OFF
          -DDIGITOR_BUILD_TESTS=ON
          -DDIGITOR_BUILD_EXAMPLES=OFF

      - name: Build Android qualification target
        shell: bash
        run: cmake --build build-android --target digitor_native_gpu_tests --parallel 2

      - name: Record Android build evidence
        if: always()
        shell: bash
        run: |
          mkdir -p qualification
          {
            echo "classification=Compile/link verified, runtime hardware-unverified"
            echo "production_qualified=false"
            echo "abi=arm64-v8a"
            echo "api=24"
            echo "ndk=27.2.12479018"
            echo "sha=${GITHUB_SHA}"
          } > qualification/android-compile-link.txt

      - name: Upload Android build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compile-link-qualification
          path: qualification/**
          if-no-files-found: warn
