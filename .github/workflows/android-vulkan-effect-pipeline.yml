name: Android Vulkan Effect Pipeline

on:
  pull_request:
    paths:
      - 'include/digitor/android_vulkan_builtin_effect_shaders.hpp'
      - 'include/digitor/android_vulkan_effect_provider.hpp'
      - 'src/platform/android/android_vulkan_builtin_effect_shaders.cpp'
      - 'src/platform/android/android_vulkan_effect_provider.cpp'
      - 'shaders/vulkan/digitor_builtin_effect.comp'
      - 'cmake/AndroidVulkanEffectShaders.cmake'
      - 'cmake/AndroidVulkanEffectPipeline.cmake'
      - 'tests/android_vulkan_effect_pipeline/**'
      - '.github/workflows/android-vulkan-effect-pipeline.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure Android NDK environment
        shell: bash
        run: |
          echo "$ANDROID_NDK_HOME/shader-tools/linux-x86_64" >> "$GITHUB_PATH"
          test -x "$ANDROID_NDK_HOME/shader-tools/linux-x86_64/glslc"
      - name: Configure arm64-v8a qualification build
        run: |
          cmake -S tests/android_vulkan_effect_pipeline \
            -B build/android-vulkan-effects \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build provider, generated SPIR-V and pipelines
        run: cmake --build build/android-vulkan-effects --parallel 2
      - name: Emit qualification evidence
        shell: bash
        run: |
          mkdir -p artifacts
          printf '%s\n' \
            'ANDROID_VULKAN_EFFECT_PIPELINE=PASS' \
            'ABI=arm64-v8a' \
            'MIN_API=26' \
            'SPIRV_VARIANTS=RGBA8,RGBA16F' \
            'BUILTIN_EFFECTS=9' \
            'DEVICE_EXECUTION=REQUIRES_PHYSICAL_ANDROID' \
            | tee artifacts/android-vulkan-effect-pipeline.log
      - uses: actions/upload-artifact@v4
        with:
          name: android-vulkan-effect-pipeline
          path: artifacts/android-vulkan-effect-pipeline.log
          if-no-files-found: error
