name: Clean PR348 Build Artifacts

on:
  push:
    branches:
      - agent/engine-owned-platform-production

permissions:
  contents: write

jobs:
  clean:
    if: github.event.head_commit.message != 'Remove PR348 qualification artifacts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/engine-owned-platform-production
      - name: Remove generated qualification files
        shell: bash
        run: |
          git rm -r build-pr348
          git rm .github/workflows/pr348-clean-build-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove PR348 qualification artifacts"
          git push origin HEAD:agent/engine-owned-platform-production
