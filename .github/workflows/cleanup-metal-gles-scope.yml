name: Cleanup Metal GLES scope files
on:
  pull_request:
    types: [reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.head_ref == 'agent/real-metal-gles-r32f'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-metal-gles-r32f
          fetch-depth: 0
      - name: Remove temporary scope files
        run: |
          rm -f .agent/README.md .agent/SCOPE.md .github/workflows/cleanup-metal-gles-scope.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary Metal GLES scope files"
          git push origin HEAD:agent/real-metal-gles-r32f
