name: Agent patch GLES preview format transition

on:
  push:
    branches:
      - agent/gles-preview-format-transition

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gles-preview-format-transition
          fetch-depth: 0
      - name: Apply production fix and regression coverage
        run: python3 tools/agent_patch_gles_preview_format_transition.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix GLES preview float format transitions"
          git push origin HEAD:agent/gles-preview-format-transition
