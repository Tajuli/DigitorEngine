name: Temporary PR330 Dart Format

on:
  push:
    branches:
      - agent/flutter-production-sdk

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flutter-production-sdk
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format production media source
        working-directory: dart/digitor_engine_ffi
        run: dart format lib/src/production_media.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dart/digitor_engine_ffi/lib/src/production_media.dart
          git commit -m "Format production media Dart API"
          git push origin HEAD:agent/flutter-production-sdk
