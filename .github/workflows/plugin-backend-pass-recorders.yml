name: Plugin Backend Pass Recorders

on:
  pull_request:
    paths:
      - 'include/digitor/plugin_backend_pass_recorders.hpp'
      - 'src/plugin/plugin_backend_pass_recorders.cpp'
      - 'tests/plugin_backend_pass_recorders/**'
      - '.github/workflows/plugin-backend-pass-recorders.yml'
  workflow_dispatch:

jobs:
  qualify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/plugin_backend_pass_recorders -B build/plugin-backend-pass-recorders -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/plugin-backend-pass-recorders --config Release --parallel 2
      - name: Qualify on Unix
        if: runner.os != 'Windows'
        run: build/plugin-backend-pass-recorders/digitor_plugin_backend_pass_recorders_qualification | tee plugin-backend-pass-recorders.log
      - name: Qualify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: build/plugin-backend-pass-recorders/Release/digitor_plugin_backend_pass_recorders_qualification.exe | Tee-Object -FilePath plugin-backend-pass-recorders.log
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-backend-pass-recorders-${{ runner.os }}
          path: plugin-backend-pass-recorders.log
          if-no-files-found: error
