name: CPU SIMD Qualification

on:
  pull_request:
    paths:
      - 'include/digitor/cpu_simd.hpp'
      - 'src/cpu/cpu_backend.cpp'
      - 'tests/test_cpu_simd.cpp'
      - '.github/workflows/cpu-simd-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'include/digitor/cpu_simd.hpp'
      - 'src/cpu/cpu_backend.cpp'
      - 'tests/test_cpu_simd.cpp'
      - '.github/workflows/cpu-simd-qualification.yml'

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.os }} portable dispatch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude tests/test_cpu_simd.cpp -o cpu_simd_test
          ./cpu_simd_test | tee cpu-simd-report.txt

      - name: Compile and run (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude tests/test_cpu_simd.cpp -o cpu_simd_test
          ./cpu_simd_test | tee cpu-simd-report.txt

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile and run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /O2 /EHsc /W4 /WX /Iinclude tests/test_cpu_simd.cpp /Fe:cpu_simd_test.exe
          .\cpu_simd_test.exe | Tee-Object -FilePath cpu-simd-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cpu-simd-report-${{ matrix.os }}
          path: cpu-simd-report.txt
          if-no-files-found: error

  avx2-compile:
    name: AVX2 kernel compile and parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          g++ -std=c++20 -O2 -mavx2 -Wall -Wextra -Werror -Iinclude tests/test_cpu_simd.cpp -o cpu_simd_avx2_test
          if grep -q avx2 /proc/cpuinfo; then
            ./cpu_simd_avx2_test | tee cpu-simd-avx2-report.txt
          else
            echo 'AVX2 binary compiled; runner does not expose AVX2, execution skipped safely.' | tee cpu-simd-avx2-report.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-simd-avx2-report
          path: cpu-simd-avx2-report.txt
