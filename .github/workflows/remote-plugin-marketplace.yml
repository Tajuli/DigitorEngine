name: Remote Filter Effects Marketplace

on:
  pull_request:
    paths:
      - 'include/digitor/remote_plugin_marketplace.hpp'
      - 'src/plugin/remote_plugin_marketplace.cpp'
      - 'tests/remote_plugin_marketplace/**'
      - 'docs/remote-plugin-marketplace-v1.md'
      - '.github/workflows/remote-plugin-marketplace.yml'
  workflow_dispatch:

jobs:
  qualify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/remote_plugin_marketplace -B build/remote-plugin-marketplace -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/remote-plugin-marketplace --config Release --parallel 2
      - name: Qualify Unix
        if: runner.os != 'Windows'
        run: build/remote-plugin-marketplace/digitor_remote_plugin_marketplace_qualification | tee remote-plugin-marketplace.log
      - name: Qualify Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: build/remote-plugin-marketplace/Release/digitor_remote_plugin_marketplace_qualification.exe | Tee-Object -FilePath remote-plugin-marketplace.log
      - uses: actions/upload-artifact@v4
        with:
          name: remote-plugin-marketplace-${{ runner.os }}
          path: remote-plugin-marketplace.log
          if-no-files-found: error
