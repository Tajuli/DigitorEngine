name: Native RGB Curves qualification

on:
  workflow_dispatch:
  pull_request:

jobs:
  desktop-native:
    name: ${{ matrix.backend }} qualification
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, backend: Windows D3D12/Vulkan}
          - {os: macos-latest, backend: macOS Metal}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDIGITOR_ENABLE_FFMPEG=OFF -DDIGITOR_BUILD_EXAMPLES=OFF
      - run: cmake --build build --config Release --target digitor_native_gpu_tests --parallel 2
      - name: Execute qualification (unavailable hardware is a CTest skip)
        run: ctest --test-dir build -C Release -R digitor_native_gpu_tests --output-on-failure --output-log native-rgb-curves.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rgb-curves-${{ runner.os }}
          path: build/native-rgb-curves.log

  android-ndk-compile:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-android -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 -DDIGITOR_ENABLE_FFMPEG=OFF -DDIGITOR_BUILD_EXAMPLES=OFF
      - run: cmake --build build-android --target digitor_native_gpu_tests --parallel 2
      - run: printf '%s\n' '{"classification":"Android NDK compile/link verified, runtime hardware-unverified","abi":"${{ matrix.abi }}","api":26,"physical_hardware_verified":false,"execution":"not-run"}' > android-qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-rgb-curves-Android-${{ matrix.abi }}-compile-link
          path: android-qualification.json
