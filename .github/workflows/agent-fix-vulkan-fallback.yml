name: Agent Vulkan Fallback Fix

on:
  push:
    branches:
      - agent/android-vulkan-ahardwarebuffer-import

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-vulkan-ahardwarebuffer-import
          fetch-depth: 0
      - name: Apply fallback correction
        run: python3 tools/agent_fix_vulkan_nonplatform_fallback.py
      - name: Validate and publish source correction
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gpu/vulkan_backend.cpp
          git diff --cached --check
          git commit -m "Restore Vulkan nonplatform import fallback"
          git push origin HEAD:agent/android-vulkan-ahardwarebuffer-import
