name: FFmpeg VFR Preview Export Parity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vfr-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
      - name: Generate deterministic VFR fixture
        run: |
          mkdir -p build/fixtures
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=320x180:rate=15:duration=1" \
            -f lavfi -i "testsrc2=size=320x180:rate=30:duration=1" \
            -f lavfi -i "sine=frequency=880:sample_rate=48000:duration=2" \
            -filter_complex "[0:v][1:v]concat=n=2:v=1:a=0[v]" \
            -map "[v]" -map 2:a -fps_mode vfr \
            -c:v mpeg4 -q:v 3 -pix_fmt yuv420p \
            -enc_time_base:v 1:60000 -video_track_timescale 60000 \
            -c:a aac -b:a 128k -shortest \
            build/fixtures/vfr_media.mp4
      - name: Configure
        run: >-
          cmake -S . -B build/native
          -DDIGITOR_BUILD_TESTS=ON
          -DDIGITOR_BUILD_EXAMPLES=OFF
          -DDIGITOR_ENABLE_FFMPEG=ON
          -DDIGITOR_REQUIRE_FFMPEG=ON
          -DDIGITOR_ENABLE_NATIVE_SHADER_COMPILER=OFF
          -DDIGITOR_WARNINGS_AS_ERRORS=OFF
          -DDIGITOR_VFR_MEDIA_FIXTURE=${{ github.workspace }}/build/fixtures/vfr_media.mp4
      - name: Build
        run: cmake --build build/native --config Release --target digitor_ffmpeg_vfr_parity_test
      - name: Run VFR parity qualification
        run: ctest --test-dir build/native -C Release --output-on-failure -R digitor_ffmpeg_vfr_parity
