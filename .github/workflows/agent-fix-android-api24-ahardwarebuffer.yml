name: Agent Android API24 AHardwareBuffer Fix

on:
  push:
    branches:
      - agent/android-vulkan-ahardwarebuffer-import

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-vulkan-ahardwarebuffer-import
          fetch-depth: 0
      - name: Apply API24-safe Android AHardwareBuffer resolver
        run: python tools/agent_fix_android_api24_ahardwarebuffer.py
      - name: Validate and publish source fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gpu/vulkan_backend.cpp
          git diff --cached --check
          git commit -m "Fix Android API24 Vulkan AHardwareBuffer build"
          git push origin HEAD:agent/android-vulkan-ahardwarebuffer-import
