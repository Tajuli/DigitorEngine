name: Windows Vulkan Built-in Effect Pipeline

on:
  pull_request:
    paths:
      - 'include/digitor/windows_vulkan_builtin_effect_shaders.hpp'
      - 'src/platform/windows/windows_vulkan_builtin_effect_shaders.cpp'
      - 'cmake/WindowsVulkanEffectShaders.cmake'
      - 'shaders/vulkan/digitor_builtin_effect.comp'
      - 'tools/embed_spirv.py'
      - 'tests/windows_vulkan_builtin_effect_pipeline/**'
      - '.github/workflows/windows-vulkan-builtin-effect-pipeline.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --yes --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK installation directory was not found' }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Test-Path "$($sdk.FullName)\Bin\glslc.exe")) { throw 'glslc was not installed' }
          if (-not (Test-Path "$($sdk.FullName)\Bin\spirv-val.exe")) { throw 'spirv-val was not installed' }
      - name: Configure shader qualification
        shell: pwsh
        run: cmake -S tests/windows_vulkan_builtin_effect_pipeline -B build/windows-vulkan-pipeline -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build shader qualification
        shell: pwsh
        run: cmake --build build/windows-vulkan-pipeline --config Release --parallel 2
      - name: Validate generated SPIR-V
        shell: pwsh
        run: |
          spirv-val --target-env vulkan1.1 build/windows-vulkan-pipeline/generated/digitor/digitor_windows_builtin_effect_rgba8.spv
          spirv-val --target-env vulkan1.1 build/windows-vulkan-pipeline/generated/digitor/digitor_windows_builtin_effect_rgba16f.spv
      - name: Run package contract test
        shell: pwsh
        run: build/windows-vulkan-pipeline/Release/digitor_windows_vulkan_builtin_effect_pipeline_qualification.exe | Tee-Object -FilePath windows-vulkan-builtin-effect-pipeline.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows-vulkan-builtin-effect-pipeline
          path: windows-vulkan-builtin-effect-pipeline.log
          if-no-files-found: error
