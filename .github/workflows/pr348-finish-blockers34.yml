name: Finish Blockers 3 and 4

on:
  push:
    branches:
      - agent/engine-owned-platform-production

permissions:
  contents: write

jobs:
  finish:
    if: github.event.head_commit.message != 'Complete engine-owned platform production wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/engine-owned-platform-production
      - name: Apply source completion patch
        run: |
          python3 tool/pr348_finish.py
          python3 tool/pr348_fix_test_include.py
      - name: Configure Release tests
        run: cmake -S . -B build-pr348 -DDIGITOR_BUILD_TESTS=ON -DDIGITOR_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build Release tests
        run: cmake --build build-pr348 --parallel 2
      - name: Run Release tests
        run: ctest --test-dir build-pr348 --output-on-failure
      - name: Commit completed wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete engine-owned platform production wiring"
          git push origin HEAD:agent/engine-owned-platform-production
