name: Production Motion Blur
on:
  pull_request:
  push:
    branches: [main]
jobs:
  qualify:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/production_motion_blur -B build/motion_blur -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/motion_blur --config Release --parallel 2
      - name: Test Unix
        if: runner.os != 'Windows'
        run: ./build/motion_blur/digitor_production_motion_blur
      - name: Test Windows
        if: runner.os == 'Windows'
        run: .\build\motion_blur\Release\digitor_production_motion_blur.exe
