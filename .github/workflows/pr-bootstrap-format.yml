name: PR Bootstrap Dart Format

on:
  push:
    branches:
      - agent/flutter-production-app-bootstrap

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply Dart formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flutter-production-app-bootstrap
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format Dart package
        working-directory: dart/digitor_engine_ffi
        run: dart format lib test hook
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dart/digitor_engine_ffi/lib dart/digitor_engine_ffi/test dart/digitor_engine_ffi/hook
          git commit -m "Apply Dart formatter"
          git push origin HEAD:agent/flutter-production-app-bootstrap
