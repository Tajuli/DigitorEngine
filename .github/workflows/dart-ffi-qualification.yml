name: Dart FFI Qualification

on:
  pull_request:
    paths:
      - 'dart/digitor_engine_ffi/**'
      - 'include/digitor/timeline_audio_session.h'
      - '.github/workflows/dart-ffi-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart/digitor_engine_ffi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Pin each production session to one node graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/production.dart')
          text = path.read_text()
          needle = """    if (_outstandingPreviewGeneration != null) {
              throw StateError(
                'Consume the current preview before rebinding the node graph.',
              );
            }
            _check(
          """
          replacement = """    if (_outstandingPreviewGeneration != null) {
              throw StateError(
                'Consume the current preview before rebinding the node graph.',
              );
            }
            if (_graph != null && !identical(_graph, graph)) {
              throw StateError(
                'A production session is pinned to one node graph. '
                'Create a new session to use a different graph.',
              );
            }
            _check(
          """
          if needle not in text:
              raise SystemExit('bindNodeGraph insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - run: dart format lib/src/native_node_graph_api.dart lib/src/native_production_api.dart lib/src/node_graph.dart lib/src/production.dart test/production_public_api_test.dart
      - name: Restore qualification workflow and push formatted sources
        working-directory: .
        run: |
          cat > .github/workflows/dart-ffi-qualification.yml <<'YAML'
          name: Dart FFI Qualification

          on:
            pull_request:
              paths:
                - 'dart/digitor_engine_ffi/**'
                - 'include/digitor/timeline_audio_session.h'
                - '.github/workflows/dart-ffi-qualification.yml'
            workflow_dispatch:

          jobs:
            analyze-test:
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: dart/digitor_engine_ffi
              steps:
                - uses: actions/checkout@v4
                - uses: subosito/flutter-action@v2
                  with:
                    channel: stable
                - run: flutter pub get
                - run: dart format .
                - run: flutter analyze --fatal-infos
                - run: flutter test
          YAML
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/dart-ffi-qualification.yml \
            dart/digitor_engine_ffi/lib/src/native_node_graph_api.dart \
            dart/digitor_engine_ffi/lib/src/native_production_api.dart \
            dart/digitor_engine_ffi/lib/src/node_graph.dart \
            dart/digitor_engine_ffi/lib/src/production.dart \
            dart/digitor_engine_ffi/test/production_public_api_test.dart
          if git diff --cached --quiet; then
            echo 'No formatter changes to commit.'
          else
            git commit -m 'Format production Flutter bridge and pin graph lifetime'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: flutter analyze --fatal-infos
      - run: flutter test
